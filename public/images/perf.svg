<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <!-- Fondo con gradiente -->
  <defs>
    <linearGradient id="bg3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="perf" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="400" height="300" fill="url(#bg3)"/>

  <!-- Ejes -->
  <line x1="40" y1="250" x2="380" y2="250" stroke="#475569" stroke-width="1"/>
  <line x1="40" y1="50" x2="40" y2="250" stroke="#475569" stroke-width="1"/>

  <!-- Grid lines -->
  <line x1="40" y1="200" x2="380" y2="200" stroke="#1e293b" stroke-width="1" stroke-dasharray="4 4"/>
  <line x1="40" y1="150" x2="380" y2="150" stroke="#1e293b" stroke-width="1" stroke-dasharray="4 4"/>
  <line x1="40" y1="100" x2="380" y2="100" stroke="#1e293b" stroke-width="1" stroke-dasharray="4 4"/>

  <!-- Barras de performance -->
  <rect x="80" y="180" width="40" height="70" fill="url(#perf)" rx="4"/>
  <rect x="140" y="130" width="40" height="120" fill="url(#perf)" rx="4"/>
  <rect x="200" y="90" width="40" height="160" fill="url(#perf)" rx="4" opacity="0.95"/>
  <rect x="260" y="110" width="40" height="140" fill="url(#perf)" rx="4" opacity="0.85"/>
  <rect x="320" y="60" width="40" height="190" fill="url(#perf)" rx="4" opacity="0.75"/>

  <!-- Score 100 -->
  <circle cx="200" cy="50" r="22" fill="#22c55e"/>
  <text x="200" y="57" text-anchor="middle" fill="#ffffff" font-size="16" font-family="system-ui, -apple-system, sans-serif" font-weight="800">
    100
  </text>

  <!-- Texto inferior -->
  <text x="200" y="280" text-anchor="middle" fill="#e0e7ff" font-size="16" font-family="system-ui, -apple-system, sans-serif" font-weight="600">
    Lighthouse Performance
  </text>
</svg>